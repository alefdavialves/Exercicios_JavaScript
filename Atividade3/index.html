<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3 - DOM Conceitos Básicos</title>
</head>
<body>
    <h1>DOM: Página Interativa com JavaScript</h1>
    <hr>

    <h2>Contador de cliques</h2>
    <p id="result"></p>
    <button id="decrementar">Decrementar</button>
    <button id="incrementar">Incrementar</button>

    <hr>
    <h2>Adicionar texto dinâmico: </h2>
    <label for="campo">Digite algo</label>
    <input type="text" name="campo" id="campo">
    
    <p>Contador de caracteres: <span id="caracteres"></span></p>
    <div id="espaco"></div>

    <hr>
    <h2>Adicionar novo item:</h2>

    <label for="newItem">Escolha uma opção:</label>
    <select name="newItem" id="newItem">
        <option value="ol">Lista Ordenada</option>
        <option value="ul">Lista Não Ordenada</option>
        <option value="h1">h1</option>
    </select>
    <button id="addItem">Adicionar Item</button>

    <div id="newItensBox"></div>

    <hr>
    <button id="reset">Reset</button>
    
    <script src="script.js"></script>
</body>
</html>
